{% extends "base.html" %}
{% block content %}
<div class="login-wrapper">
    <div class="login-card">
        <h1>Вход</h1>
        <p>Войдите в аккаунт, чтобы продолжить работу с журналом.</p>

        <form method="post">
            {% csrf_token %}

            <div class="form-group">
                <label for="">Логин</label>
                {{ form.username }}
            </div>

            <div class="form-group">
                <label for="">Пароль</label>
                {{ form.password }}
            </div>

            <button type="submit" class="btn btn-primary">Войти</button>
        </form>

        <div class="bottom-link">
            Нет аккаунта? <a href="{% url 'registration' %}">Регистрация</a>
        </div>
    </div>
</div>
{% endblock %}

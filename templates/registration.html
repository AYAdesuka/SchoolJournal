{% extends 'base.html' %}

{% block title %}Регистрация{% endblock %}

{% block content %}
<div class="register-container">
    <h2>Регистрация пользователя</h2>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}

        <button type="submit">Создать пользователя</button>
    </form>

    <p class="login-link">
        Уже зарегистрированы?
        <a href="{% url 'login' %}">Войти</a>
    </p>
</div>
{% endblock %}

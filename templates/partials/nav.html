<nav class="navbar">
    <div class="navbar-container">

        <div class="navbar-left">
            <a href="{% url 'main:home' %}" class="logo">SchoolJournal</a>
        </div>

        <div class="navbar-center">
            <div class="flex-display">
                <a href="{% url 'main:home' %}">Главная</a>
                <a href="#">Классы</a>
                <a href="#">Ученики</a>
                <a href="{% url 'main:gradebook' %}">Журнал</a>
            </div>
        </div>

        <div class="navbar-right">
            {% if user.is_authenticated %}
                <div class="user-menu">
                    <a href="{% url 'accounts:profile' %}" class="user-badge">
                        <span class="user-avatar">{{ user.username|slice:":1"|upper }}</span>
                        <span class="user-name">{{ user.username }}</span>
                    </a>
                    <form action="{% url 'accounts:logout' %}" method="post" class="logout-form">
                        {% csrf_token %}
                        <button type="submit" class="logout-btn">Выйти</button>
                    </form>
                </div>
            {% else %}
                <a href="{% url 'accounts:login' %}" class="auth-link">Войти</a>
            {% endif %}
        </div>
    </div>
</nav>
